[build]
  functions = "netlify/functions"

[build.environment]
  # SUPABASE_URL y SUPABASE_ANON_KEY son intencionalmente públicas (se usan en el
  # cliente, protegidas por Row Level Security) — el escaneo de secretos de Netlify
  # las marca como falso positivo porque aparecen en assets/supabase-config.js.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY"

# La generación de informes puede tardar más que el límite por defecto (10s) en
# reportes largos o con plantilla/índice personalizados. Si el plan de Netlify no
# permite subir esto, simplemente lo ignora/limita — no rompe nada dejarlo puesto.
[functions."generate-report"]
  timeout = 26
