<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ingresar — FonoIA</title>
<link rel="stylesheet" href="../assets/app.css" />
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </span>
      FonoIA
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login">Iniciar sesión</button>
      <button class="auth-tab" id="tab-signup">Crear cuenta</button>
    </div>

    <!-- LOGIN -->
    <form id="form-login">
      <h1>Bienvenido de nuevo</h1>
      <p class="sub">Ingresá para ver tus pacientes.</p>
      <div class="field">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" required />
      </div>
      <div class="field">
        <label for="login-password">Contraseña</label>
        <input type="password" id="login-password" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
      <p class="form-message" id="login-message"></p>
    </form>

    <!-- SIGNUP -->
    <form id="form-signup" style="display:none">
      <h1>Creá tu cuenta</h1>
      <p class="sub">Gratis durante el beta. Sin tarjeta de crédito.</p>
      <div class="field">
        <label for="signup-name">Nombre</label>
        <input type="text" id="signup-name" required />
      </div>
      <div class="field">
        <label for="signup-lastname">Apellido</label>
        <input type="text" id="signup-lastname" required />
      </div>
      <div class="field">
        <label for="signup-profession">Profesión</label>
        <select id="signup-profession" required>
          <option value="fonoaudiologia" selected>Fonoaudiología</option>
          <option value="psicomotricidad">Psicomotricidad</option>
          <option value="psicopedagogia">Psicopedagogía</option>
          <option value="terapia_ocupacional">Terapia Ocupacional</option>
          <option value="psicologia">Psicología</option>
          <option value="fisioterapia">Fisioterapia</option>
        </select>
      </div>
      <div class="field">
        <label for="signup-email">Email</label>
        <input type="email" id="signup-email" required />
      </div>
      <div class="field">
        <label for="signup-password">Contraseña</label>
        <input type="password" id="signup-password" minlength="6" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Crear cuenta</button>
      <p class="form-message" id="signup-message"></p>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/supabase-config.js"></script>
<script src="../assets/app-auth.js"></script>
<script src="../assets/media-input.js"></script>
<script>
  redirectIfLoggedIn();

  const tabLogin = document.getElementById("tab-login");
  const tabSignup = document.getElementById("tab-signup");
  const formLogin = document.getElementById("form-login");
  const formSignup = document.getElementById("form-signup");

  tabLogin.addEventListener("click", () => {
    tabLogin.classList.add("active");
    tabSignup.classList.remove("active");
    formLogin.style.display = "block";
    formSignup.style.display = "none";
  });
  tabSignup.addEventListener("click", () => {
    tabSignup.classList.add("active");
    tabLogin.classList.remove("active");
    formSignup.style.display = "block";
    formLogin.style.display = "none";
  });

  if (new URLSearchParams(window.location.search).get("tab") === "signup") {
    tabSignup.click();
  }

  formLogin.addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = e.submitter;
    const msg = document.getElementById("login-message");
    setLoading(btn, "Ingresando...");
    msg.textContent = "";
    msg.className = "form-message";

    const email = document.getElementById("login-email").value;
    const password = document.getElementById("login-password").value;

    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      clearLoading(btn);
      msg.textContent = error.message === "Invalid login credentials"
        ? "Email o contraseña incorrectos."
        : error.message;
      msg.classList.add("error");
      return;
    }
    await sb.from("login_events").insert({ user_id: data.user.id });
    window.location.href = "dashboard.html";
  });

  formSignup.addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = e.submitter;
    const msg = document.getElementById("signup-message");
    setLoading(btn, "Creando cuenta...");
    msg.textContent = "";
    msg.className = "form-message";

    const name = document.getElementById("signup-name").value;
    const lastname = document.getElementById("signup-lastname").value;
    const fullName = `${name} ${lastname}`.trim();
    const profession = document.getElementById("signup-profession").value;
    const email = document.getElementById("signup-email").value;
    const password = document.getElementById("signup-password").value;

    const { data, error } = await sb.auth.signUp({
      email,
      password,
      options: { data: { full_name: fullName, profession } },
    });

    if (error) {
      clearLoading(btn);
      msg.textContent = error.message;
      msg.classList.add("error");
      return;
    }

    if (data.session) {
      await sb.from("login_events").insert({ user_id: data.user.id });
      window.location.href = "dashboard.html";
    } else {
      clearLoading(btn);
      msg.textContent = "¡Listo! Revisá tu email para confirmar la cuenta antes de ingresar.";
      msg.classList.add("success");
    }
  });
</script>
</body>
</html>
